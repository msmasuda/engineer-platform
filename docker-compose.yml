services:
  postgres:
    image: postgres:16-alpine
    container_name: engineer-platform-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: engineer-platform-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "${REDIS_PORT:?REDIS_PORT is required}:6379"
    volumes:
      - redis_data:/data

  srh:
    image: hiett/serverless-redis-http:latest
    container_name: engineer-platform-srh
    restart: unless-stopped
    ports:
      - "${KV_REST_API_PORT:?KV_REST_API_PORT is required}:80"
    environment:
      SRH_MODE: "env"
      SRH_CONNECTION_STRING: "redis://default:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379"
      SRH_TOKEN: "${KV_REST_API_TOKEN:?KV_REST_API_TOKEN is required}"
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
